# =============================================================================
# Geode Go Client CI/CD Pipeline
# Uses DevNW CI/CD Catalog components
# =============================================================================
#
# Security Note: Unit tests and lint checks MUST NOT allow failure to prevent
# security regressions from being merged. Only optional stages (integration
# tests requiring external services, SBOM scanning) may allow failure.
#
# Supply Chain Security: All CI components are pinned to specific versions
# for supply chain security (CWE-1104). Review and update versions periodically.

include:
  # Pinned to v1.11.0 for supply chain security
  - component: gitlab.com/devnw/ci-catalog/go-lint@v1.9.15
    inputs:
      stage: lint
      # Lint includes gosec security checks - must not allow failure
      allow_failure: false

  - component: gitlab.com/devnw/ci-catalog/go-build@v1.9.15
    inputs:
      go_version: "1.25.8"
      stage: build

  - component: gitlab.com/devnw/ci-catalog/go-test@v1.9.15
    inputs:
      go_version: "1.25.8"
      stage: test
      # Unit tests (with -short flag) must pass. Integration tests that
      # require a running Geode server are skipped with -short.
      allow_failure: false

  # Security scanning - pinned to v1.11.0
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.9.15
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.9.15
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.9.15
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.9.15

  # SBOM generation and scanning - pinned to v1.11.0
  # allow_failure: external syft download may fail due to DNS/network issues
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.9.15

  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.9.15

  # Release creation - pinned to v1.11.0
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.9.15
    inputs:
      stage: release

# SBOM jobs may fail due to DNS/network issues downloading syft
sbom-generate:
  allow_failure: true

sbom-scan:
  allow_failure: true

default:
  tags:
    - company
    - linux

stages:
  - lint
  - build
  - test
  - security
  - sbom
  - release
