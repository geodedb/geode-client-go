# =============================================================================
# Geode Go Client CI/CD Pipeline
# Uses DevNW CI/CD Catalog components
# =============================================================================
#
# Security Note: Unit tests and lint checks MUST NOT allow failure to prevent
# security regressions from being merged. Only optional stages (integration
# tests requiring external services, SBOM scanning) may allow failure.
#
# Supply Chain Security: All CI components are pinned to specific versions
# for supply chain security (CWE-1104). Review and update versions periodically.

include:
  # Pinned to v1.11.0 for supply chain security
  - component: gitlab.com/devnw/ci-catalog/go-lint@v1.48.0
    inputs:
      stage: lint
      # Lint includes gosec security checks - must not allow failure
      allow_failure: false
      # go.mod targets go 1.27; the component default (v2.11.3) is built
      # with go 1.26 and refuses to load the config.
      golangci_version: 'v2.13.1'

  - component: gitlab.com/devnw/ci-catalog/go-build@v1.48.0
    inputs:
      go_version: "1.25.8"
      stage: build

  - component: gitlab.com/devnw/ci-catalog/go-test@v1.48.0
    inputs:
      go_version: "1.25.8"
      stage: test
      # Unit tests (with -short flag) must pass. Integration tests that
      # require a running Geode server are skipped with -short.
      allow_failure: false

  # Security scanning - pinned to v1.11.0
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.48.0
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.48.0
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.48.0
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.48.0

  # SBOM generation and scanning - pinned to v1.11.0
  # allow_failure: external syft download may fail due to DNS/network issues
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.48.0

  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.48.0

  # Release creation - pinned to v1.11.0
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.48.0
    inputs:
      stage: release

# SBOM jobs may fail due to DNS/network issues downloading syft
  # Security findings -> auto-triaged Jira SEC issues (.post; reads gl-*-report
  # artifacts). component_id 12496 = SEC > Vuln Mgmt.
  - component: gitlab.com/devnw/ci-catalog/jira-event-intake@v1.48.0
    inputs:
      project_key: SEC
      component_id: "12496"

sbom-generate:
  allow_failure: true

sbom-scan:
  allow_failure: true

default:
  tags:
    - company
    - linux

stages:
  - lint
  - build
  - test
  - integration
  - security
  - sbom
  - release

# =============================================================================
# Proto drift gate (SONNY-806 / GAP-0841).
#
# The vendored proto/geode.proto is a copy of the engine's canonical
# src/proto/geode.proto (provenance recorded in proto/CANONICAL). This job runs
# the always-on reflection guards for HelloRequest and ExecuteRequest, so a
# regeneration that drops a canonical field fails the pipeline. The engine repo
# is not on disk here, so the source-level comparison self-skips; regeneration
# itself is reproducible via `make generate-proto`, whose plugin versions are
# pinned in the Makefile (PROTOC_GEN_GO_VERSION / PROTOC_GEN_GO_GRPC_VERSION).
# =============================================================================
proto-check:
  stage: lint
  image: golang:1.27
  script:
    - make proto-check
  allow_failure: false
  tags:
    - company
    - linux

# =============================================================================
# Integration lane — real pinned Geode engine, race detector on.
# Mocks never satisfy a release gate (GEO-GO-UP-001).
#
# The service image is pinned by tag AND digest so a republished tag cannot
# silently change what this gate runs against. It MUST match GEODE_IMAGE in
# the Makefile and pinnedEngineVersion in integration_version_test.go;
# TestIntegration_PinnedEngineVersion fails the lane if they drift apart.
# =============================================================================
integration:geode:
  stage: integration
  image: golang:1.27
  services:
    - name: geodedb/geode:0.8.15@sha256:96a194cfce01e59ee1dbe1504aa0ed79c0141f7e2e8b23389da18e73e6adc8ee
      alias: geode
      command:
        - serve
        - --listen
        - 0.0.0.0:3141
        - --listen-grpc
        - 0.0.0.0:50051
        - --log-level
        - info
        # SONNY-1218 workaround: the image's default CMD passes --data-dir
        # /data, but this service overrides command and drops it. Without a
        # storage adapter the engine's node_scan_stream fast path returns
        # empty rows instead of declining, which silently corrupts several
        # integration tests' results. Required until the engine declines the
        # fast path when no adapter is configured. Container-local
        # filesystem only; nothing is mounted from the host.
        - --data-dir
        - /data
  variables:
    GEODE_AUTH_HMAC_KEY: "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef" # gitleaks:allow
    # Seed the admin credential so the engine does not generate a one-time
    # password; matches testAdminPassphrase in integration_test.go.
    GEODE_ADMIN_PASSWORD: "Correct horse battery staple" # gitleaks:allow
    GEODE_STRICT_TENANCY: "1"
    GEODE_QUIC_ENABLE_STREAM_MULTIPLEXING: "1"
    # The integration service above runs with GEODE_STRICT_TENANCY=1, so this
    # manual-mode DSN must bind a concrete tenant: without it every data
    # statement is refused with GQLSTATE 42501 "Tenant scope required".
    # Keep the tenant id in sync with harnessTenant (integration_main_test.go)
    # and GEODE_TEST_TENANT (Makefile).
    GEODE_TEST_DSN: "geode:3141?insecure=true&user=geode&pass=Correct%20horse%20battery%20staple&tenant=it-harness"
  script:
    - go test -race -v -tags=integration -timeout=20m ./...
  allow_failure: false
  tags:
    - company
    - linux
