# =============================================================================
# Geode Go Client CI/CD Pipeline
# Uses DevNW CI/CD Catalog components
# =============================================================================
#
# Security Note: Unit tests and lint checks MUST NOT allow failure to prevent
# security regressions from being merged. Only optional stages (integration
# tests requiring external services, SBOM scanning) may allow failure.

include:
  - component: gitlab.com/devnw/ci-catalog/go-lint@latest
    inputs:
      stage: lint
      # Lint includes gosec security checks - must not allow failure
      allow_failure: false

  - component: gitlab.com/devnw/ci-catalog/go-build@latest
    inputs:
      go_version: "1.24"
      stage: build

  - component: gitlab.com/devnw/ci-catalog/go-test@latest
    inputs:
      go_version: "1.24"
      stage: test
      # Unit tests (with -short flag) must pass. Integration tests that
      # require a running Geode server are skipped with -short.
      allow_failure: false

  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@latest
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@latest
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-secrets@latest
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@latest

  # SBOM generation and scanning
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@latest

  - component: gitlab.com/devnw/ci-catalog/sbom-scan@latest
    inputs:
      allow_failure: true

  # Release creation
  - component: gitlab.com/devnw/ci-catalog/release-semantic@latest
    inputs:
      stage: release

default:
  tags:
    - company
    - linux

stages:
  - lint
  - build
  - test
  - security
  - sbom
  - release
