# =============================================================================
# Geode Go Client CI/CD Pipeline
# Uses DevNW CI/CD Catalog components
# =============================================================================

include:
  - component: gitlab.com/devnw/ci-catalog/go-lint@latest
    inputs:
      stage: lint
      allow_failure: true

  - component: gitlab.com/devnw/ci-catalog/go-build@latest
    inputs:
      go_version: "1.24"
      stage: build

  - component: gitlab.com/devnw/ci-catalog/go-test@latest
    inputs:
      go_version: "1.24"
      stage: test
      allow_failure: true  # Tests may require running Geode server

  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@latest
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@latest
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-secrets@latest
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@latest

  # SBOM generation and scanning
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@latest

  - component: gitlab.com/devnw/ci-catalog/sbom-scan@latest
    inputs:
      allow_failure: true

  # Release creation
  - component: gitlab.com/devnw/ci-catalog/release-semantic@latest
    inputs:
      stage: release

default:
  tags:
    - company
    - linux

stages:
  - lint
  - build
  - test
  - security
  - sbom
  - release
