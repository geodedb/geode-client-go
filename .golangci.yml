version: '2'
linters:
  default: none
  enable:
  - asasalint
  - asciicheck
  - bidichk
  - bodyclose
  - copyloopvar
  - cyclop
  - dupl
  - durationcheck
  - errcheck
  - errname
  - exhaustive
  - forbidigo
  - funlen
  - gochecknoglobals
  - gocognit
  - goconst
  - gocritic
  - gocyclo
  - gomoddirectives
  - gomodguard
  - goprintffuncname
  - gosec
  - govet
  - ineffassign
  - lll
  - loggercheck
  - makezero
  - mnd
  - nakedret
  - nestif
  - nilerr
  - nilnil
  - noctx
  - nolintlint
  - nosprintfhostport
  - predeclared
  - promlinter
  - reassign
  - revive
  - rowserrcheck
  - sqlclosecheck
  - staticcheck
  - testableexamples
  - tparallel
  - unconvert
  - unparam
  - unused
  - usestdlibvars
  - wastedassign
  - whitespace
  settings:
    cyclop:
      max-complexity: 30
      package-average: 10
    errcheck:
      check-type-assertions: true
    exhaustive:
      check:
      - switch
      - map
    funlen:
      lines: 100
      statements: 50
    gocognit:
      min-complexity: 30
    gocritic:
      settings:
        captLocal:
          paramsOnly: false
        underef:
          skipRecvDeref: false
    gomodguard:
      blocked:
        modules:
        - github.com/golang/protobuf:
            recommendations:
            - google.golang.org/protobuf
            reason: see https://developers.google.com/protocol-buffers/docs/reference/go/faq#modules
        - github.com/satori/go.uuid:
            recommendations:
            - github.com/google/uuid
            reason: satori's package is not maintained
        - github.com/gofrs/uuid:
            recommendations:
            - github.com/google/uuid
            reason: 'see recommendation from dev-infra team: https://confluence.gtforge.com/x/gQI6Aw'
    govet:
      disable:
      - fieldalignment
      - shadow
      enable-all: true
    mnd:
      ignored-functions:
      - os.Chmod
      - os.Mkdir
      - os.MkdirAll
      - os.OpenFile
      - os.WriteFile
      - prometheus.ExponentialBuckets
      - prometheus.ExponentialBucketsRange
      - prometheus.LinearBuckets
    nakedret:
      max-func-lines: 0
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-no-explanation:
      - funlen
      - gocognit
      - lll
    rowserrcheck:
      packages:
      - github.com/jmoiron/sqlx
    tagliatelle:
      case:
        rules:
          json: snake
          xml: camel
          yaml: camel
  exclusions:
    generated: lax
    presets:
    - comments
    - common-false-positives
    - legacy
    - std-error-handling
    rules:
    - linters:
      - lll
      source: ^//\s*go:generate\s
    - linters:
      - godot
      source: (noinspection|TODO)
    - linters:
      - gocritic
      source: //noinspection
    - linters:
      - errorlint
      source: ^\s+if _, ok := err\.\([^.]+\.InternalError\); ok {
    - linters:
      - bodyclose
      - copyloopref
      - dupl
      - errcheck
      - funlen
      - gochecknoglobals
      - goconst
      - gocyclo
      - lll
      - mnd
      - noctx
      - rowserrcheck
      - sqlclosecheck
      - wrapcheck
      path: _test\.go
      # Note: gosec intentionally NOT excluded from test files to detect
      # security issues like hardcoded credentials in test code.
    # Exclude certain linters from example/benchmark CLI programs
    # These programs intentionally use fmt.Print* for user output and have
    # simplified code for demonstration purposes
    - linters:
      - forbidigo
      - cyclop
      - gochecknoglobals
      - noctx
      - mnd
      - funlen
      - gocognit
      - gocritic
      - sqlclosecheck
      - rowserrcheck
      path: ^(example|cmd/benchmark)/
    # crypto/ package name intentionally matches stdlib; callers import as geocrypto
    - linters:
      - revive
      text: avoid package names that conflict
      path: ^crypto/
    paths:
    - testdata
    - third_party$
    - builtin$
    - examples$
    - example$
issues:
  max-same-issues: 50
formatters:
  enable:
  - goimports
  exclusions:
    generated: lax
    paths:
    - testdata
    - third_party$
    - builtin$
    - examples$
